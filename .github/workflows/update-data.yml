name: Update quota data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17,18 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scheduled-pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install --upgrade pip openpyxl

      - name: Gate scheduled run to 19:00 Europe/Brussels
        id: time_gate
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Europe/Brussels"))
          print(f"Europe/Brussels time: {now.isoformat()}")
          if now.hour != 19:
              raise SystemExit(78)
          PY
        continue-on-error: true

      - name: Stop non-matching DST run
        if: github.event_name == 'schedule' && steps.time_gate.outcome == 'failure'
        run: echo "Skipping extra cron run outside 19:00 Europe/Brussels."

      - name: Refresh data
        if: github.event_name != 'schedule' || steps.time_gate.outcome == 'success'
        run: python fetch_data.py

      - name: Commit updated data
        if: github.event_name != 'schedule' || steps.time_gate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/orders.json public/data/eu-steel-trq-4a-dashboard.xlsx
          git diff --cached --quiet && exit 0
          git commit -m "Update EU steel TRQ data"
          git push

      - name: Configure Pages
        if: github.event_name != 'schedule' || steps.time_gate.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Build static site
        if: github.event_name != 'schedule' || steps.time_gate.outcome == 'success'
        run: node scripts/build.mjs

      - name: Upload artifact
        if: github.event_name != 'schedule' || steps.time_gate.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        if: github.event_name != 'schedule' || steps.time_gate.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
